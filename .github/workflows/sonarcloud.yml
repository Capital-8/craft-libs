name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # Pin the coverage-font fix while craft-common-actions #88 awaits human review.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@cd0afc675210347496971204cb81d58d80bd6eaf
    with:
      pdf-test-fonts: true
    secrets: inherit
